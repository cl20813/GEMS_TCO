name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Verify installed package is not shadowed by src
        run: |
          python -I -c "import os; from pathlib import Path; import GEMS_TCO; package_path = Path(GEMS_TCO.__file__).resolve(); source_path = (Path(os.environ['GITHUB_WORKSPACE']) / 'src').resolve(); assert source_path not in package_path.parents, package_path; print(package_path)"

      - name: Run tests against installed package
        run: python -I -m unittest discover -s tests -v
